services:
  - type: web
    name: umashankar-portfolio
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
